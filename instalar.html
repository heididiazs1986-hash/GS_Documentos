<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A5BD7">
<link rel="manifest" href="/manifest-install.json?v=81">
<link rel="icon" href="/gs-docs-icon-192.png">
<title>Instalar GS Documentos</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#eef4fa;color:#12345a;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{max-width:460px;width:100%;background:white;border-radius:28px;padding:30px;box-shadow:0 18px 50px #173d6620;text-align:center}
img{width:96px;height:96px;border-radius:22px}
h1{font-size:28px;margin:18px 0 8px}p{line-height:1.45;color:#5b6f86}
button,a.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:18px;padding:16px 18px;font-size:18px;font-weight:800;margin-top:18px;text-decoration:none}
#install{background:#0A5BD7;color:#fff}.secondary{background:#edf3f9;color:#12345a}
.note{font-size:14px;margin-top:18px}
</style>
</head>
<body>
<div class="card">
<img src="/gs-docs-icon-192.png" alt="GS Documentos">
<h1>GS Documentos</h1>
<p>Instalación de la versión APPLUS. Este acceso usa una identidad nueva y estable para evitar el registro antiguo de Chrome.</p>
<button id="install" disabled>Preparando instalación…</button>
<a class="btn secondary" href="/index.html?v=gsdoc-v81-field-utility">Abrir sin instalar</a>
<p class="note" id="status">Espera unos segundos. Cuando el botón diga “Instalar GS Documentos”, tócala una sola vez.</p>
</div>
<script>
let deferredPrompt=null;
const btn=document.getElementById('install'),status=document.getElementById('status');
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e;
  btn.disabled=false; btn.textContent='Instalar GS Documentos';
  status.textContent='Lista para instalar.';
});
btn.addEventListener('click',async()=>{
  if(!deferredPrompt){
    status.textContent='Chrome aún está preparando la instalación. Cierra esta pestaña, vuelve a abrir este mismo enlace y espera 5 segundos.';
    return;
  }
  deferredPrompt.prompt();
  const choice=await deferredPrompt.userChoice;
  deferredPrompt=null;
  if(choice.outcome==='accepted'){
    btn.textContent='Instalando…'; btn.disabled=true;
    status.textContent='Instalación aceptada. En unos segundos aparecerá GS Documentos en tus aplicaciones.';
  }
});
window.addEventListener('appinstalled',()=>{
  btn.textContent='GS Documentos instalada'; btn.disabled=true;
  status.textContent='Listo. Ya puedes abrirla desde el teléfono.';
});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js?v=gsdoc-v81-field-utility').catch(()=>{}));
}
setTimeout(()=>{
  if(!deferredPrompt){
    btn.disabled=false; btn.textContent='Reintentar instalación';
    status.textContent='Si Chrome todavía conserva el registro viejo, toca “Reintentar instalación”. Si no aparece el aviso, usa “Abrir sin instalar” y te indico el único ajuste del teléfono que falta.';
  }
},5000);
</script>
</body>
</html>
