<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FF6600"><link rel="manifest" href="/manifest.json?v=gsdoc-v113-txt-user-picker"><link rel="icon" href="/gs-docs-icon-192.png"><title>Instalar GS Documentos</title><style>body{margin:0;font-family:Manrope,Segoe UI,sans-serif;background:#f9f9fa;color:#1a1c1d;min-height:100vh;display:grid;place-items:center;padding:22px;box-sizing:border-box}.card{max-width:430px;width:100%;background:#fff;border:1px solid #dfe2e4;border-radius:16px;padding:26px;box-sizing:border-box;text-align:center}img{width:88px;height:88px;border-radius:18px}h1{font-family:Open Sans,Segoe UI,sans-serif;color:#0b3c70;font-size:26px;margin:16px 0 8px}p{line-height:1.5;color:#68757f}button,a{display:block;width:100%;box-sizing:border-box;border-radius:16px;padding:13px 16px;font-size:16px;font-weight:600;margin-top:14px;text-decoration:none}button{border:0;background:#ff6600;color:#fff}.secondary{background:#c1c7ce;color:#20272c}.note{font-size:13px}</style></head><body><div class="card"><img src="/gs-docs-icon-192.png" alt="GS Documentos"><h1>GS Documentos</h1><p>Instala la aplicación web para trabajar en campo y conservar el acceso offline después de la primera carga.</p><button id="install" disabled>Preparando instalación…</button><a class="secondary" href="/index.html?v=gsdoc-v113-txt-user-picker">Abrir sin instalar</a><p class="note" id="status">Espera unos segundos.</p></div><script>let deferredPrompt=null;const b=document.getElementById('install'),s=document.getElementById('status');addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;b.disabled=false;b.textContent='Instalar GS Documentos';s.textContent='Lista para instalar.'});b.onclick=async()=>{if(!deferredPrompt){s.textContent='Chrome aún no ofrece la instalación. Abre la aplicación y vuelve a intentarlo.';return}deferredPrompt.prompt();const c=await deferredPrompt.userChoice;deferredPrompt=null;if(c.outcome==='accepted'){b.disabled=true;b.textContent='Instalando…';s.textContent='Instalación aceptada.'}};addEventListener('appinstalled',()=>{b.disabled=true;b.textContent='GS Documentos instalada';s.textContent='Listo.'});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js?v=gsdoc-v113-txt-user-picker').catch(()=>{}));</script></body></html>
