<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A5BD7"><title>Recuperar GS Documentos</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#eef4fa;color:#12345a;min-height:100vh;display:grid;place-items:center;margin:0;padding:22px;box-sizing:border-box}
.card{max-width:440px;background:#fff;border:1px solid #dce3ea;border-radius:24px;padding:26px;text-align:center;box-shadow:0 14px 36px #173d6618}
.spinner{width:44px;height:44px;border:5px solid #dfe8f0;border-top-color:#ff6600;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}h1{font-size:24px;margin:0 0 8px}p{color:#66788a;line-height:1.45}
</style>
</head>
<body>
<div class="card"><div class="spinner"></div><h1>Recuperando GS Documentos</h1>
<p>No se borrarán registros ni datos guardados. Solo se renovará la caché de la aplicación.</p>
<p id="msg">Actualizando…</p></div>
<script>
(async()=>{
 try{
   if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister();}
   if('caches' in window){const ks=await caches.keys();for(const k of ks)if(k.toLowerCase().includes('gs-doc'))await caches.delete(k);}
 }catch(e){console.warn(e)}
 document.getElementById('msg').textContent='Listo. Abriendo la aplicación…';
 setTimeout(()=>location.replace('/index.html?v=gsdoc-recovery-'+Date.now()),700);
})();
</script>
</body>
</html>
