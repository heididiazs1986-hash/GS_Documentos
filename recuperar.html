<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FF6600"><title>Recuperar GS Documentos</title><style>body{font-family:Manrope,Segoe UI,sans-serif;background:#f9f9fa;color:#1a1c1d;min-height:100vh;display:grid;place-items:center;margin:0;padding:22px;box-sizing:border-box}.card{max-width:420px;background:#fff;border:1px solid #dfe2e4;border-radius:16px;padding:26px;text-align:center}.spinner{width:42px;height:42px;border:4px solid #e1e4e6;border-top-color:#ff6600;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-family:Open Sans,Segoe UI,sans-serif;color:#0b3c70;font-size:23px;margin:0 0 8px}p{color:#69757f;line-height:1.5}</style></head><body><div class="card"><div class="spinner"></div><h1>Recuperando GS Documentos</h1><p>No se borrarán los registros guardados. Solo se renovará la caché de la aplicación.</p><p id="msg">Actualizando…</p></div><script>(async()=>{try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())if(k.toLowerCase().includes('gs-doc'))await caches.delete(k)}}catch(e){console.warn(e)}document.getElementById('msg').textContent='Listo. Abriendo la aplicación…';setTimeout(()=>location.replace('/index.html?v=gsdoc-v113-txt-user-picker-'+Date.now()),700)})();</script></body></html>
